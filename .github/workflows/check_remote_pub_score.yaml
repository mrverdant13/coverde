name: Check remote Pub.dev score for Coverde CLI

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-remote-pub-score:
    name: Check remote Pub.dev score for Coverde CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: ccc3d80a9ff466b4219ff969b06361c7b7d7e076}}
      - name: Bootstrap packages
        run: ripple run get --fail-fast
      - name: Install dependencies
        run: sudo apt-get install -y webp
      - name: Verify remote Pub.dev score
        id: remote-pub-score-check
        run: |
          set +e
          ripple run pub-score.remote
          echo "PUB_SCORE_CHECK_RESULT=$?" >> $GITHUB_OUTPUT
      - name: Set step summary
        if: always()
        run: |
          report="packages/coverde_cli/.dart_tool/remote_pub_score.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update issue
        run: |
          set -euo pipefail
          result="${{ steps.remote-pub-score-check.outputs.PUB_SCORE_CHECK_RESULT }}"
          report="${{ env.ISSUE_BODY_FILEPATH }}"
          if [[ "$result" != "0" && ! -f "$report" ]]; then
            echo "::error::pub-score checker failed without writing a report (exit $result)"
            exit 1
          fi
          issueNumber=$(\
            gh issue list \
              --search "${{ env.ISSUE_SEARCH_TERM }}" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
            )
          if [[ "$result" == "0" ]]; then
            if [[ -n $issueNumber ]]; then
              echo "Issue already exists: $issueNumber"
              gh issue close $issueNumber --comment "Remote Pub.dev score is valid"
            fi
          else
            if [[ -n $issueNumber ]]; then
              echo "Issue already exists: $issueNumber"
              gh issue edit $issueNumber \
                --body-file "$report"
            else
              echo "Issue does not exist"
              gh issue create \
                --title "${{ env.ISSUE_TITLE }}" \
                --body-file "$report" \
                --label "triage" \
                --label "p:coverde" \
                --assignee "mrverdant13"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_SEARCH_TERM: "bug coverde-cli remote Pub.dev score is not valid"
          ISSUE_TITLE: "bug(coverde-cli): remote Pub.dev score is not valid"
          ISSUE_BODY_FILEPATH: packages/coverde_cli/.dart_tool/remote_pub_score.md
