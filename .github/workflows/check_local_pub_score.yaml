name: Check local Pub.dev score for Coverde CLI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - packages/coverde_cli/**
      - tools/pub_score_checker/**
      - .github/workflows/check_local_pub_score.yaml
      - ripple.yaml

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-local-pub-score:
    name: Check local Pub.dev score for Coverde CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 364f05aa0db1dd2a0f8a70856f312cfb1a6df73a}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Install dependencies
        run: sudo apt-get install -y webp
      - name: Verify local Pub.dev score
        id: local-pub-score-check
        run: |
          set +e
          ripple run pub-score.local
          echo "PUB_SCORE_CHECK_RESULT=$?" >> $GITHUB_OUTPUT
      - name: Set step summary
        if: always()
        run: |
          report="packages/coverde_cli/.dart_tool/local_pub_score.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update issue
        run: |
          set -euo pipefail
          result="${{ steps.local-pub-score-check.outputs.PUB_SCORE_CHECK_RESULT }}"
          report="${{ env.ISSUE_BODY_FILEPATH }}"
          if [[ "$result" != "0" && ! -f "$report" ]]; then
            echo "::error::pub-score checker failed without writing a report (exit $result)"
            exit 1
          fi
          issueNumber=$(\
            gh issue list \
              --search "${{ env.ISSUE_SEARCH_TERM }}" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
            )
          if [[ "$result" == "0" ]]; then
            if [[ -n $issueNumber ]]; then
              echo "Issue already exists: $issueNumber"
              gh issue close $issueNumber --comment "Local Pub.dev score is valid"
            fi
          else
            if [[ -n $issueNumber ]]; then
              echo "Issue already exists: $issueNumber"
              gh issue edit $issueNumber \
                --body-file "$report"
            else
              echo "Issue does not exist"
              gh issue create \
                --title "${{ env.ISSUE_TITLE }}" \
                --body-file "$report" \
                --label "triage" \
                --label "p:coverde" \
                --assignee "mrverdant13"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_SEARCH_TERM: "bug coverde-cli local Pub.dev score is not valid"
          ISSUE_TITLE: "bug(coverde-cli): local Pub.dev score is not valid"
          ISSUE_BODY_FILEPATH: packages/coverde_cli/.dart_tool/local_pub_score.md
