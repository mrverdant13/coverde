# CI workflow
name: Dart CI

# Triggers the workflow on push or pull request events but only for the `main` branch
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  min-conditions:
    name: Check spelling, format and analyze codebase
    runs-on: ubuntu-latest
    env:
      PRESET_OPTIONS: ${{ github.event_name == 'pull_request' && '--preset ci-pr' || '' }}
    outputs:
      publish_coverage: ${{ steps.coverage-publish.outputs.publish }}
    steps:
      - name: Resolve whether to publish coverage
        id: coverage-publish
        run: echo "publish=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          config: ./.cspell/cspell.yaml
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Fetch main for changed-package selection
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main
      - name: Bootstrap packages
        run: ripple run get --fail-fast ${{ env.PRESET_OPTIONS }}
      - name: Format and analyze
        run: ripple run format.gate ${{ env.PRESET_OPTIONS }} && ripple run analyze.gate --fail-fast ${{ env.PRESET_OPTIONS }}

  min-sdk-consumer:
    name: Min-SDK consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.0
      - name: Install ripple
        run: >
          dart pub global activate --source git
          https://github.com/mrverdant13/ripple.git
          --git-ref 27d5a0bc6f78f4ff35651a820b4fbae80cd96670
      - name: Run min-SDK consumer smoke
        run: ripple run test.min-sdk --fail-fast

  src-gen:
    name: Ensure up-to-date source generation
    runs-on: ubuntu-latest
    needs: min-conditions
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Bootstrap packages
        run: ripple run get --fail-fast
      - name: Verify up-to-date generated source files
        working-directory: packages/coverde_cli/
        run: dart test --run-skipped -t ci-only test/ensure_up_to_date_src_gen_test.dart

  test:
    name: Test implementation
    needs: src-gen
    runs-on: ${{ matrix.os }}
    env:
      PRESET_OPTIONS: ${{ github.event_name == 'pull_request' && '--preset ci-pr' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Fetch main for changed-package selection
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main
      - name: Bootstrap packages
        run: ripple run get --fail-fast ${{ env.PRESET_OPTIONS }}
      - name: Run tests
        run: ripple run test --fail-fast ${{ env.PRESET_OPTIONS }}
      - name: Sanitize coverage
        run: ripple run coverage.sanitize
      - name: Check coverage
        run: ripple run coverage.check --fail-fast
      - name: Merge coverage
        run: ripple run coverage.merge
      - name: Update coverage trace file as artifact
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && hashFiles('coverage/merged.lcov.info') != ''
        with:
          name: merged.lcov.info
          path: ./coverage/merged.lcov.info
          retention-days: 1

  codecov:
    name: Publish coverage results
    needs:
      - min-conditions
      - test
    if: needs.min-conditions.outputs.publish_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      # Codecov needs a git checkout so the CLI can build the file network and
      # map LCOV SF: paths; without it uploads succeed but reports are unusable.
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download coverage trace file artifacts
        uses: actions/download-artifact@v8
        with:
          name: merged.lcov.info
          path: coverage
      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: coverage/merged.lcov.info
          fail_ci_if_error: true
          verbose: true
