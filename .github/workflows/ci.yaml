# CI workflow
name: Dart CI

# Triggers the workflow on push or pull request events but only for the `main` branch
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  min-conditions:
    name: Check spelling, format and analyze codebase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: ./.cspell/cspell.yaml
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 364f05aa0db1dd2a0f8a70856f312cfb1a6df73a}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Format and analyze
        run: ripple run format.ci && ripple run analyze.ci --fail-fast

  release-tools:
    name: Test release tools (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: min-conditions
    strategy:
      fail-fast: false
      matrix:
        package:
          - tools/prepare_package_release
          - tools/wait_for_pub_dev_version
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Format, analyze, and test
        working-directory: ${{ matrix.package }}
        run: >
          dart format --set-exit-if-changed . &&
          dart analyze --fatal-infos --fatal-warnings . &&
          dart test

  src-gen:
    name: Ensure up-to-date source generation
    runs-on: ubuntu-latest
    needs: min-conditions
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 364f05aa0db1dd2a0f8a70856f312cfb1a6df73a}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Verify up-to-date generated source files
        working-directory: packages/coverde_cli/
        run: dart test --run-skipped -t ci-only test/ensure_up_to_date_src_gen_test.dart

  test:
    name: Test implementation
    needs: src-gen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 364f05aa0db1dd2a0f8a70856f312cfb1a6df73a}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Run tests, merge tests if needed, and check 100% coverage
        run: ripple run test.ci --fail-fast && ripple run coverage.merge && ripple run coverage.check
      - name: Update coverage trace file as artifact
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: filtered.lcov.info
          path: ./coverage/filtered.lcov.info
          retention-days: 1

  codecov:
    name: Publish coverage results
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage trace file artifacts
        uses: actions/download-artifact@v8
        with:
          name: filtered.lcov.info
      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          directory: ./coverage/
          files: ./filtered.lcov.info
          fail_ci_if_error: true
          verbose: true
