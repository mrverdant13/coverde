# CI workflow
name: Dart CI

# Triggers the workflow on push or pull request events but only for the `main` branch
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  min-conditions:
    name: Check spelling, format and analyze codebase
    runs-on: ubuntu-latest
    outputs:
      publish_coverage: ${{ steps.coverage-publish.outputs.publish }}
    steps:
      - name: Resolve whether to publish coverage
        id: coverage-publish
        run: echo "publish=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          config: ./.cspell/cspell.yaml
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: ccc3d80a9ff466b4219ff969b06361c7b7d7e076}}
      - name: Bootstrap packages
        run: ripple run get.ci --fail-fast
      - name: Format and analyze
        run: ripple run format.ci && ripple run analyze.ci --fail-fast

  release-tools:
    name: Test release tools (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: min-conditions
    strategy:
      fail-fast: false
      matrix:
        package:
          - tools/prepare_package_release
          - tools/wait_for_pub_dev_version
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Format, analyze, and test
        working-directory: ${{ matrix.package }}
        run: >
          dart format --set-exit-if-changed . &&
          dart analyze --fatal-infos --fatal-warnings . &&
          dart test

  src-gen:
    name: Ensure up-to-date source generation
    runs-on: ubuntu-latest
    needs: min-conditions
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: ccc3d80a9ff466b4219ff969b06361c7b7d7e076}}
      - name: Bootstrap packages
        run: ripple run get.ci --fail-fast
      - name: Verify up-to-date generated source files
        working-directory: packages/coverde_cli/
        run: dart test --run-skipped -t ci-only test/ensure_up_to_date_src_gen_test.dart

  test:
    name: Test implementation
    needs: src-gen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: ccc3d80a9ff466b4219ff969b06361c7b7d7e076}}
      - name: Bootstrap packages
        run: ripple run get.ci --fail-fast
      - name: Run tests, merge tests if needed, and check 100% coverage
        run: ripple run test.ci --fail-fast && ripple run coverage.merge && ripple run coverage.check
      - name: Update coverage trace file as artifact
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: filtered.lcov.info
          path: ./coverage/filtered.lcov.info
          retention-days: 1

  codecov:
    name: Publish coverage results
    needs:
      - min-conditions
      - test
    if: needs.min-conditions.outputs.publish_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage trace file artifacts
        uses: actions/download-artifact@v8
        with:
          name: filtered.lcov.info
          path: coverage
      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: coverage/filtered.lcov.info
          fail_ci_if_error: true
          verbose: true
