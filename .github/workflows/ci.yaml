# CI workflow
name: Dart CI

# Triggers the workflow on push or pull request events but only for the `main` branch
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  min-conditions:
    name: Check spelling, format and analyze codebase
    runs-on: ubuntu-latest
    outputs:
      publish_coverage: ${{ steps.coverage-publish.outputs.publish }}
    steps:
      - name: Resolve whether to publish coverage
        id: coverage-publish
        run: echo "publish=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v9
        with:
          config: ./.cspell/cspell.yaml
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Fetch main for changed-package selection
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
      - name: Bootstrap packages
        shell: bash
        env:
          RIPPLE_CHANGED_PRESET: ${{ github.event_name == 'pull_request' && 'ci-pr' || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RIPPLE_CHANGED_PRESET}" ]; then
            ripple run get --fail-fast --preset "${RIPPLE_CHANGED_PRESET}"
          else
            ripple run get --fail-fast
          fi
      - name: Format and analyze
        shell: bash
        env:
          RIPPLE_CHANGED_PRESET: ${{ github.event_name == 'pull_request' && 'ci-pr' || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RIPPLE_CHANGED_PRESET}" ]; then
            ripple run format.gate --preset "${RIPPLE_CHANGED_PRESET}"
            ripple run analyze.gate --fail-fast --preset "${RIPPLE_CHANGED_PRESET}"
          else
            ripple run format.gate && ripple run analyze.gate --fail-fast
          fi

  min-sdk-consumer:
    name: Min-SDK consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.7.0
      - name: Install ripple
        run: >
          dart pub global activate --source git
          https://github.com/mrverdant13/ripple.git
          --git-ref 27d5a0bc6f78f4ff35651a820b4fbae80cd96670
      - name: Run min-SDK consumer smoke
        run: ripple run test.min-sdk --fail-fast

  src-gen:
    name: Ensure up-to-date source generation
    runs-on: ubuntu-latest
    needs: min-conditions
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Bootstrap packages
        run: ripple run get --fail-fast
      - name: Verify up-to-date generated source files
        working-directory: packages/coverde_cli/
        run: dart test --run-skipped -t ci-only test/ensure_up_to_date_src_gen_test.dart

  test:
    name: Test implementation
    needs: src-gen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 27d5a0bc6f78f4ff35651a820b4fbae80cd96670}}
      - name: Fetch main for changed-package selection
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
      - name: Detect affected test packages
        id: affected-tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(ripple list --preset ci-pr --depends-on test --dir-exists test)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap packages
        if: github.event_name != 'pull_request' || steps.affected-tests.outputs.run == 'true'
        shell: bash
        env:
          RIPPLE_CHANGED_PRESET: ${{ github.event_name == 'pull_request' && 'ci-pr' || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RIPPLE_CHANGED_PRESET}" ]; then
            ripple run get --fail-fast --preset "${RIPPLE_CHANGED_PRESET}"
          else
            ripple run get --fail-fast
          fi
      - name: Run tests, merge tests if needed, and check 100% coverage
        if: github.event_name != 'pull_request' || steps.affected-tests.outputs.run == 'true'
        shell: bash
        env:
          RIPPLE_CHANGED_PRESET: ${{ github.event_name == 'pull_request' && 'ci-pr' || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RIPPLE_CHANGED_PRESET}" ]; then
            ripple run test --fail-fast --preset "${RIPPLE_CHANGED_PRESET}"
          else
            ripple run test --fail-fast
          fi
          ripple run coverage.merge
          ripple run coverage.check
      - name: Update coverage trace file as artifact
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || steps.affected-tests.outputs.run == 'true')
        with:
          name: filtered.lcov.info
          path: ./coverage/filtered.lcov.info
          retention-days: 1

  codecov:
    name: Publish coverage results
    needs:
      - min-conditions
      - test
    if: needs.min-conditions.outputs.publish_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      # Codecov needs a git checkout so the CLI can build the file network and
      # map LCOV SF: paths; without it uploads succeed but reports are unusable.
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download coverage trace file artifacts
        uses: actions/download-artifact@v8
        with:
          name: filtered.lcov.info
          path: coverage
      - name: Upload coverage data to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: coverage/filtered.lcov.info
          fail_ci_if_error: true
          verbose: true
