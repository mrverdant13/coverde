name: Install Dart CLI package
description: Run dart install and add the install bin directory to PATH
inputs:
  package:
    description: >-
      Package for dart install: a Dart 3.13+ package descriptor, a hosted
      name, or a Git URL (use git-ref on Dart 3.10).
    required: true
  git-ref:
    description: >-
      Passed as --git-ref. Required with a Git URL on Dart 3.10, which does
      not parse package descriptors.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE_DESCRIPTOR: ${{ inputs.package }}
        GIT_REF: ${{ inputs.git-ref }}
      run: |
        set -euo pipefail
        install_args=("$PACKAGE_DESCRIPTOR")
        if [[ -n "$GIT_REF" ]]; then
          install_args+=(--git-ref "$GIT_REF")
        fi
        output="$(dart install "${install_args[@]}")"
        echo "$output"

        installed="$(echo "$output" | grep '^Installed:' | sed 's|^Installed: ||')"
        if [[ -z "$installed" ]]; then
          echo "::error::dart install did not report an Installed: path for ${PACKAGE_DESCRIPTOR}."
          exit 1
        fi

        # Git Bash dirname only splits on '/', so normalize Windows separators.
        installed="${installed//\\//}"
        bin_dir="$(dirname -- "$installed")"
        echo "$bin_dir" >> "$GITHUB_PATH"
