name: coverde

packages:
  include:
    - .
    - packages/*
    - packages/*/e2e/*
    - tools/*
  exclude:
    - '**/example/**'
    - '**/test/fixtures/**'
    - '**/e2e/fixtures/**'
    - '**/e2e/e2e/fixtures/**'
    - tools/readmes_resolver/lib/sample_project
  groups:
    e2e:
      - packages/coverde_cli/e2e/suite
    min-sdk-consumer:
      - packages/coverde_cli/e2e/min_sdk_smoke
    publishable:
      - packages/coverde_cli
    tools:
      - tools/package_assets_generator
      - tools/package_data_generator
      - tools/pub_score_checker
      - tools/readmes_resolver
      - tools/prepare_package_release
      - tools/wait_for_pub_dev_version
  filtersPresets:
    local:
      - changed:
          checks:
            - since:origin/main
            - workdir:HEAD
          exclude:
            - '**/*.md'
    ci-pr:
      - changed:
          checks: since:origin/main
          exclude:
            - '**/*.md'
    tested:
      - fileExists:
          - coverage/lcov.info
    coverage-sanitized:
      - fileExists:
          - coverage/sanitized.lcov.info
    testable:
      - or:
          - dependsOn:
              - test
          - dependsOn:
              - flutter_test
      - dirExists:
          - test

replacements:
  dart: dart
  coverde: "{{dart}} run coverde"
  check_pub_score: "{{dart}} run ${RIPPLE_ROOT_PATH}/tools/pub_score_checker/bin/pub_score_checker.dart check_pub_score"

scripts:
  get:
    description: Get packages whose resolution is missing or stale
    exec: "{{dart}} pub get"
    filters:
      - pubGet: missing
        asOf: live
    dependentsFilters:
      - pubGet: missing
        asOf: live

  # The root package is skipped: `dart format .` there walks every nested
  # package, including ones whose analysis options are not resolved.
  format:
    description: Format a package
    exec: "{{dart}} format ."
    filters:
      - noMatch:
          - coverde_monorepo
  format.gate:
    description: Fail if formatting would change any file
    exec: "{{dart}} format --set-exit-if-changed ."
    filters:
      - noMatch:
          - coverde_monorepo

  analyze:
    description: Analyze a package
    exec: "{{dart}} analyze ."
    dependentsFilters: []
  analyze.gate:
    description: Analyze and treat infos and warnings as errors
    exec: "{{dart}} analyze --fatal-infos --fatal-warnings ."
    dependentsFilters: []

  gen:
    description: Run code generation for a package
    exec: "{{dart}} run build_runner build --delete-conflicting-outputs"
    filters:
      - dependsOn:
          - build_runner

  spellcheck:
    description: Run spell checking for the entire project
    run: cspell lint --config .cspell/cspell.yaml --no-progress ${RIPPLE_ROOT_PATH}/**

  test:
    description: Run tests and generate coverage trace file for a package
    exec:
      - "{{coverde}} optimize-tests --exclude '**/fixtures/**' --include test/**_test.dart --output test/optimized_test.dart"
      - "{{dart}} test --coverage-path coverage/lcov.info --coverage-package ${RIPPLE_PACKAGE_NAME} --exclude-tags ci-only --reporter expanded --test-randomize-ordering-seed random test/optimized_test.dart"
    filters:
      - preset: testable
    dependentsFilters:
      - preset: testable

  coverage.sanitize:
    description: Remove generated files from a package coverage trace
    exec: "{{coverde}} transform --input coverage/lcov.info --output coverage/sanitized.lcov.info --mode w --transformations preset=drop-generated-code"
    filters:
      - preset: tested

  coverage.check:
    description: Check a package coverage trace against its pkg-min threshold
    exec: "{{coverde}} check --input coverage/sanitized.lcov.info pkg-min"
    filters:
      - preset: coverage-sanitized

  coverage.merge:
    description: Merge sanitized package coverage traces into one root trace
    run:
      - "{{coverde}} rm --no-dry-run ${RIPPLE_ROOT_PATH}/coverage/filtered.lcov.info"
      - "ripple exec --preset coverage-sanitized -- '{{coverde}}' transform --input coverage/sanitized.lcov.info --output ${RIPPLE_ROOT_PATH}/coverage/filtered.lcov.info --transformations relative=${RIPPLE_ROOT_PATH}"
  coverage.report:
    description: Generate HTML coverage report
    run: "{{coverde}} report --input ${RIPPLE_ROOT_PATH}/coverage/filtered.lcov.info --output ${RIPPLE_ROOT_PATH}/coverage/html/"

  test.e2e:
    description: Run E2E tests
    exec:
      - git clean -dfX .
      - "{{dart}} test --run-skipped --tags e2e e2e"
    filters:
      - group: e2e
      - dirExists:
          - e2e

  test.min-sdk:
    description: Resolve and smoke-run coverde as a consumer on PATH Dart
    exec:
      - "{{dart}} pub get"
      - "{{coverde}} --help"
      - "{{coverde}} value --input fixtures/lcov.info"
      - "{{dart}} --version"
    filters:
      - group: min-sdk-consumer

  pub-score.local:
    description: Check local pub.dev score for publishable packages
    exec: "{{check_pub_score}} local --markdown-output ${RIPPLE_PACKAGE_PATH}/.dart_tool/local_pub_score.md --package-path ${RIPPLE_PACKAGE_PATH} --threshold 0"
    filters:
      - group: publishable
  pub-score.remote:
    description: Check remote pub.dev score for publishable packages
    exec: "{{check_pub_score}} remote --markdown-output ${RIPPLE_PACKAGE_PATH}/.dart_tool/remote_pub_score.md --package-name ${RIPPLE_PACKAGE_NAME} --threshold 0"
    filters:
      - group: publishable

  release.prepare:
    description: >
      Bump version and changelog for a single package release. Set
      RIPPLE_PACKAGES=<package> to scope to one package.
    exec:
      - "{{dart}} run ${RIPPLE_ROOT_PATH}/tools/prepare_package_release/prepare_package_release.dart --cwd ${RIPPLE_PACKAGE_PATH} --tag-format '{name}-v{version}' --scopes coverde-cli --commit-types feat,fix,docs,refactor,perf,test,build,chore --major-types= --minor-types feat!,fix! --patch-types feat,fix --build-types docs,refactor,perf,test,build,chore --apply"
      - "{{dart}} run build_runner build --delete-conflicting-outputs"
    filters:
      - group: publishable

  # Unscoped full gate. For a single package, run the package-filtered steps with
  # RIPPLE_PACKAGES=<package> (format.gate / analyze.gate stay repo-wide).
  release.check:
    description: Pre-publish gate for all publishable packages
    run:
      - ripple run format.gate
      - ripple run analyze.gate --fail-fast
      - ripple run test --fail-fast
      - ripple run pub-score.local --fail-fast
      - "ripple exec --group publishable --fail-fast -- '{{dart}}' pub publish --dry-run"

  docs.cli:
    description: Resolve CLI README file
    run: "{{dart}} run ${RIPPLE_ROOT_PATH}/tools/readmes_resolver/lib/resolve_root_readme.dart --example-dirs=${RIPPLE_ROOT_PATH}/packages/coverde_cli/doc/examples/browser/ --example-dirs=${RIPPLE_ROOT_PATH}/packages/coverde_cli/doc/examples/terminal/ --example-dirs=${RIPPLE_ROOT_PATH}/packages/coverde_cli/doc/examples/markdown/ --readme=${RIPPLE_ROOT_PATH}/packages/coverde_cli/README.md"

  clean:
    description: Deep clean-up
    run: git clean -dfX ${RIPPLE_ROOT_PATH}
